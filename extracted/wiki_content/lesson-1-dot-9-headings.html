<p>Now let's get something on the page.</p>
<p>h1 is a big heading. It often matches the title.</p>
<p>Add a heading that says Sports to your page, like this:</p>
<pre>&lt;!DOCTYPE html&gt;<br><br>&lt;html&gt;<br><br>&nbsp; &lt;head&gt;<br><br>&nbsp; &nbsp; &lt;title&gt;Sports&lt;/title&gt;<br><br>&nbsp; &lt;/head&gt;<br><br>&nbsp; &lt;body&gt;<br><br>&nbsp; &nbsp; &lt;h1&gt;Sports&lt;/h1&gt;<br><br>&nbsp; &lt;/body&gt;<br><br>&lt;/html&gt;</pre>
</body>
</html>

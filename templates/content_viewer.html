<!-- templates/content_viewer.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ filename }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h4>{{ filename }}</h4>
        <div class="mt-3 p-3 bg-white border rounded" style="white-space: pre-wrap;">
            {{ content | safe }}
        </div>
        <a class="btn btn-secondary mt-4" href="{{ url_for('view_course') }}">⬅ Back to Structure</a>
    </div>
</body>
</html>

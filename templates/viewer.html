<!-- templates/viewer.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Viewer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4">📘 Course Structure</h2>
        <ul class="list-group">
            {% for item in items %}
                <li class="list-group-item indent-{{ item.depth }}">
                    {% if item.identifierref %}
                        <a href="{{ url_for('view_content', identifierref=item.identifierref) }}">{{ item.title }}</a>
                    {% else %}
                        {{ item.title }}
                    {% endif %}
                </li>
            {% endfor %}
        </ul>
        <a class="btn btn-secondary mt-4" href="{{ url_for('index') }}">⬅ Back to Upload</a>
    </div>
</body>
</html>
